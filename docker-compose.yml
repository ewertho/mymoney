# Dev:  docker compose up -d mongodb   (e npm run dev em backend/ e frontend/)
# Prod: cp .env.example .env && docker compose up -d --build
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mymoney
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mymoney}
    ports:
      - "127.0.0.1:27017:27017" # só a própria máquina alcança o banco
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mymoney:${MONGO_PASSWORD:-mymoney}@mongodb:27017/mymoney?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8101}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8101}:80"

volumes:
  mongo-data:
